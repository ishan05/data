name: Repository validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Repository preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/ci-preflight

  portable:
    name: Portable repository tests
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: ./scripts/ci-portable

  required:
    name: Repository validation / Background-safe repository checks
    if: always()
    needs: [preflight, portable]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every stage
        env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
        run: |
          test "$PREFLIGHT_RESULT" = success
          test "$PORTABLE_RESULT" = success
